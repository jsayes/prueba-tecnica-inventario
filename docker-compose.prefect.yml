# ============================================================================
#  Orquestación con Prefect. Base funcional entregada.
#  Uso:
#    docker compose -f docker-compose.yml -f docker-compose.prefect.yml up -d
#    docker compose -f docker-compose.yml -f docker-compose.prefect.yml \
#        exec prefect-worker prefect deploy --all
#  UI: http://localhost:4200
#
#  TODO (candidato): completar los despliegues en orchestration/prefect.yaml
# ============================================================================
services:
  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: inv_prefect_server
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"
      interval: 10s
      timeout: 5s
      retries: 12

  prefect-worker:
    build: .
    container_name: inv_prefect_worker
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      PREFECT_API_URL: http://prefect-server:4200/api
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - prefect work-pool create default --type process --overwrite && prefect worker start --pool default
    working_dir: /app
    volumes:
      - ./data:/app/data:ro
      - ./orchestration:/app/orchestration
    depends_on:
      prefect-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
