# ============================================================================
#  Despliegues de Prefect. El de catálogos está configurado como referencia.
#  Registrar:  prefect deploy --all      (dentro del contenedor del worker)
#  Ver estado: prefect deployment ls
#
#  ⬜ TODO (candidato): agregar los despliegues de ventas (3 cortes al día),
#  inventario (cada 30 minutos) y cierre diario, con sus schedules,
#  concurrencia y parámetros. Las cargas históricas NO van en el schedule.
# ============================================================================
name: etl-inventario-optimo
prefect-version: 3.0.0

deployments:
  - name: catalogos-diario
    entrypoint: orchestration/flows/etl_flows.py:flujo_catalogos
    work_pool:
      name: default
    schedules:
      - cron: "0 5 * * *"
        timezone: "America/Guatemala"
    parameters: {}

  #  Ventas Intradia
  - name: ventas-0800
    entrypoint: orchestration/flows/etl_flows.py:flujo_ventas
    work_pool: { name: default }
    schedules:
      - cron: "10 8 * * *"
        timezone: "America/Guatemala"
    parameters: { corte: "0800" }
    concurrency_limit: { limit: 1, collision_strategy: ENQUEUE }

  - name: ventas-1400
    entrypoint: orchestration/flows/etl_flows.py:flujo_ventas
    work_pool: { name: default }
    schedules:
      - cron: "10 14 * * *"
        timezone: "America/Guatemala"
    parameters: { corte: "1400" }
    concurrency_limit: { limit: 1, collision_strategy: ENQUEUE }

  - name: ventas-2000
    entrypoint: orchestration/flows/etl_flows.py:flujo_ventas
    work_pool: { name: default }
    schedules:
      - cron: "10 20 * * *"
        timezone: "America/Guatemala"
    parameters: { corte: "2000" }
    concurrency_limit: { limit: 1, collision_strategy: ENQUEUE }

  # Inventario
  - name: inventario-intradia
    entrypoint: orchestration/flows/etl_flows.py:flujo_inventario
    work_pool: { name: default }
    schedules:
      - cron: "2,32 6-23 * * *"
        timezone: "America/Guatemala"
    parameters: {}
    concurrency_limit: { limit: 1, collision_strategy: ENQUEUE }

# Cierre
  - name: cierre-diario
    entrypoint: orchestration/flows/etl_flows.py:flujo_cierre
    work_pool: { name: default }
    schedules:
      - cron: "30 0 * * *"
        timezone: "America/Guatemala"
    parameters: {}

  # Refresco de vistas materializadas.
  - name: refresco-kpis
    entrypoint: orchestration/flows/etl_flows.py:flujo_refresco_kpis
    work_pool: { name: default }
    schedules:
      - cron: "45 0 * * *"
        timezone: "America/Guatemala"
    parameters: {}
