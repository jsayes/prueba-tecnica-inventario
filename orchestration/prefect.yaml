name: etl-inventario-optimo
prefect-version: 3.0.0

deployments:
  - name: catalogos-diario
    entrypoint: orchestration/flows/etl_flows.py:flujo_catalogos
    work_pool:
      name: default
    schedules:
      - cron: "0 5 * * *"
        timezone: "America/Guatemala"
    parameters: {}

